# Packaging for macOS, Windows and Linux. See "Package it" in README.md.
# The packaged app holds the same source files that `npm start` runs: there
# is still no compile step, only an archive of them plus Electron.
appId: am.danielk.snippet-editor
productName: Snippet Editor
artifactName: ${name}-${version}-${os}-${arch}.${ext}

directories:
  output: dist
  buildResources: build

# electron-builder's default AppImage and NSIS tools for macOS are Intel-only.
# These newer tool bundles also run on Apple Silicon, so every package can be
# built from one Mac without Rosetta. electron-builder labels them beta.
toolsets:
  appimage: "1.0.3"
  nsis: "1.2.1"

# Only what the app needs at run time. Runtime dependencies (yaml) are added
# by electron-builder; tests, scripts and development tools are left out.
files:
  - electron/**
  - core/**
  - shared/**
  - renderer/**
  - mcp/**
  - build/icon.png
  - package.json

# The MCP server is started by an AI tool as a program of its own, and a
# program cannot be started from inside the archive. So this one folder is
# left as plain files beside it.
asarUnpack:
  - mcp/**

mac:
  category: public.app-category.productivity
  # No Apple Developer ID: the app is signed ad hoc, which Apple Silicon
  # needs to run it at all. It is not notarised. The hardened runtime only
  # matters for notarised apps, and with an ad hoc signature it can stop the
  # app from loading its own libraries, so it is off.
  identity: "-"
  hardenedRuntime: false
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]

win:
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  category: Utility
  synopsis: Editor for Espanso snippets
  # Names the desktop entry after `desktopName` in package.json, which is
  # also the id Electron gives its windows, so the launcher icon and the
  # running window are recognised as the same app.
  syncDesktopName: true
  target:
    - target: AppImage
      arch: [x64]
    - target: tar.gz
      arch: [x64]
